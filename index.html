<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eaglercraft Launcher</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'media',
  theme: {
    extend: {
      fontFamily: {
        sans: ['system-ui','-apple-system','BlinkMacSystemFont','"Segoe UI"', 'Roboto','"Helvetica Neue"', 'Arial','"Noto Sans SC"', 'sans-serif'],
        mono: ['"SF Mono"', 'SFMono-Regular', '"Roboto Mono"', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
      },
      colors: { ink: '#0a0a0f', paper: '#fafaf9' }
    }
  }
}
</script>
<style>
  ::selection { background: #171717; color: #fafaf9; }
  .dark ::selection { background: #e5e5e5; color: #0a0a0f; }
  .grain::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    z-index: 50;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
  .delay-100 { animation-delay: 0.1s; }
  .delay-200 { animation-delay: 0.2s; }
</style>
</head>
<body class="bg-paper text-neutral-900 dark:bg-ink dark:text-neutral-100 font-sans antialiased grain min-h-screen flex items-center justify-center px-6">

  <main class="w-full max-w-md animate-fade-up">

    <header class="mb-12">
      <div class="flex items-center gap-3 mb-6">
        <span class="font-mono text-sm text-neutral-400 dark:text-neutral-600">~/hxm535</span>
        <span class="text-neutral-300 dark:text-neutral-700">|</span>
        <span class="font-mono text-sm text-neutral-400 dark:text-neutral-600">eaglercraft</span>
      </div>
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-3">Eaglercraft</h1>
      <p class="text-neutral-600 dark:text-neutral-400 text-base">在线启动器</p>
    </header>

    <div class="space-y-8">

      <section class="animate-fade-up delay-100">
        <div class="flex items-center gap-3 mb-4">
          <h2 class="text-xs font-mono uppercase tracking-widest text-neutral-400 dark:text-neutral-600">Version</h2>
          <div class="flex-1 h-px bg-neutral-200 dark:bg-neutral-800"></div>
        </div>
        <div class="flex gap-3">
          <button onclick="pickVer(this,'1.12.2')"
            class="ver-btn flex-1 p-4 rounded-xl border text-left transition-all cursor-pointer border-neutral-900 dark:border-white ring-1 ring-neutral-900 dark:ring-white">
            <div class="font-semibold text-base">1.12.2</div>
          </button>
          <button onclick="pickVer(this,'1.8.8')"
            class="ver-btn flex-1 p-4 rounded-xl border text-left transition-all cursor-pointer border-neutral-200 dark:border-neutral-800 hover:border-neutral-400 dark:hover:border-neutral-600">
            <div class="font-semibold text-base">1.8.8</div>
          </button>
        </div>
      </section>

      <section class="animate-fade-up delay-100">
        <div class="flex items-center gap-3 mb-4">
          <h2 class="text-xs font-mono uppercase tracking-widest text-neutral-400 dark:text-neutral-600">Target</h2>
          <div class="flex-1 h-px bg-neutral-200 dark:bg-neutral-800"></div>
        </div>
        <div class="flex gap-3">
          <button onclick="pickMode(this,'window')"
            class="mode-btn flex-1 py-3 px-4 rounded-lg border text-sm font-medium transition-all cursor-pointer bg-neutral-100 dark:bg-neutral-800 border-neutral-400 dark:border-neutral-500">
            新窗口
          </button>
          <button onclick="pickMode(this,'page')"
            class="mode-btn flex-1 py-3 px-4 rounded-lg border text-sm font-medium transition-all cursor-pointer border-neutral-200 dark:border-neutral-800 hover:border-neutral-400 dark:hover:border-neutral-600">
            新页面
          </button>
        </div>
      </section>

      <section class="animate-fade-up delay-200 pt-2">
        <button onclick="launch()" id="launchBtn"
          class="w-full py-4 rounded-xl bg-neutral-900 dark:bg-white text-paper dark:text-ink font-semibold text-base transition-all hover:opacity-90 active:scale-[0.98]">
          启动
        </button>
      </section>

    </div>

    <footer class="mt-16 pt-6 border-t border-neutral-200 dark:border-neutral-800 flex items-center justify-between text-xs font-mono text-neutral-400 dark:text-neutral-600 animate-fade-up delay-200">
      <span class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
        就绪
      </span>
      <span>与 Mojang 无关</span>
    </footer>

  </main>

  <script>
    let ver = '1.12.2';
    let mode = 'window';

    function pickVer(el, val) {
      ver = val;
      document.querySelectorAll('.ver-btn').forEach(b => {
        b.className = 'ver-btn flex-1 p-4 rounded-xl border text-left transition-all cursor-pointer border-neutral-200 dark:border-neutral-800 hover:border-neutral-400 dark:hover:border-neutral-600';
      });
      el.className = 'ver-btn flex-1 p-4 rounded-xl border text-left transition-all cursor-pointer border-neutral-900 dark:border-white ring-1 ring-neutral-900 dark:ring-white';
    }

    function pickMode(el, val) {
      mode = val;
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.className = 'mode-btn flex-1 py-3 px-4 rounded-lg border text-sm font-medium transition-all cursor-pointer border-neutral-200 dark:border-neutral-800 hover:border-neutral-400 dark:hover:border-neutral-600';
      });
      el.className = 'mode-btn flex-1 py-3 px-4 rounded-lg border text-sm font-medium transition-all cursor-pointer bg-neutral-100 dark:bg-neutral-800 border-neutral-400 dark:border-neutral-500';
    }

    function launch() {
      const url = './' + ver + '/index.html';
      if (mode === 'window') {
        window.open(url, '_blank', 'width=1280,height=720,menubar=no,toolbar=no,location=no');
      } else {
        window.open(url, '_blank');
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') launch(); });
  </script>

</body>
</html>
